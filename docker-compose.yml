services:
  backend:
    build:
      context: ./sbj-convert-numbers
      dockerfile: Dockerfile
    container_name: convert-numbers-backend
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/api/management/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./react-convert-numbers
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:9090/api
    container_name: convert-numbers-frontend
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
